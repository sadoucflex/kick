<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartoon TV</title>
<style>
  :root { --y:#ffcc00; --g:#53fc18; --txt:#fff; --mut:#b5b9bd; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:#000; color:var(--txt);
    font-family: Arial, Helvetica, sans-serif; overflow:hidden; cursor:none; }

  #vid { position:fixed; inset:0; width:100%; height:100%; background:#000; object-fit:contain; }
  #shield { position:fixed; inset:0; z-index:1; }

  /* Logo de la chaîne, en filigrane comme à la télé */
  #logo { position:fixed; top:4vh; right:3.5vw; z-index:2; font-weight:900; font-size:3.2vh;
    letter-spacing:.06em; opacity:.55; text-shadow:0 0 .6vh #000; pointer-events:none; }
  #logo b { color:var(--y); }

  /* Bandeau "en ce moment" / "à suivre" */
  #info { position:fixed; left:4vw; bottom:7vh; z-index:3; max-width:70vw;
    background:linear-gradient(90deg, rgba(0,0,0,.85), rgba(0,0,0,.55)); border-left:.8vh solid var(--y);
    border-radius:.8vh; padding:2.2vh 2.4vw; transition:opacity .5s, transform .5s; }
  #info.hide { opacity:0; transform:translateY(2vh); pointer-events:none; }
  #info .lab { color:var(--y); font-size:2.1vh; font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
  #info .tit { font-size:4.4vh; font-weight:900; margin:.6vh 0; }
  #info .sub { color:var(--mut); font-size:2.3vh; }
  #info .next { color:var(--mut); font-size:2.2vh; margin-top:1.4vh; }
  #info .next b { color:#fff; }
  #bar { margin-top:1.2vh; height:.6vh; background:rgba(255,255,255,.2); border-radius:.3vh; overflow:hidden; }
  #bar i { display:block; height:100%; width:0; background:var(--y); }

  /* Boutons (pour le curseur de la TV) */
  #btns { position:fixed; top:3.5vh; left:2.5vw; z-index:4; display:flex; gap:1vw; transition:opacity .4s; }
  #btns.hide { opacity:0; pointer-events:none; }
  .pbtn { background:rgba(0,0,0,.7); color:#fff; border:.4vh solid var(--y); border-radius:1.2vh;
    font-size:2.5vh; padding:1.1vh 1.6vw; cursor:pointer; }
  body.pointer { cursor:default; }

  #toast { position:fixed; left:50%; top:12vh; transform:translateX(-50%); z-index:5;
    background:rgba(0,0,0,.8); color:#fff; font-size:2.6vh; padding:1.4vh 2.4vw; border-radius:1.2vh;
    white-space:nowrap; transition:opacity .4s; pointer-events:none; }
  #toast.hide { opacity:0; }

  /* Écran de chargement entre deux dessins animés */
  #wait { position:fixed; inset:0; z-index:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; background:#000; }
  #wait .big { font-size:7vh; font-weight:900; letter-spacing:.06em; }
  #wait .big b { color:var(--y); }
  #wait .small { color:var(--mut); font-size:2.6vh; margin-top:2vh; }
</style>
</head>
<body>

<div id="wait"><div class="big"><b>CARTOON</b> TV</div><div class="small" id="waitTxt">Chargement…</div></div>
<video id="vid" playsinline preload="auto"></video>
<div id="shield"></div>
<div id="logo"><b>CARTOON</b> TV</div>

<div id="info" class="hide">
  <div class="lab" id="iLab">En ce moment</div>
  <div class="tit" id="iTit"></div>
  <div class="sub" id="iSub"></div>
  <div id="bar"><i id="barFill"></i></div>
  <div class="next" id="iNext"></div>
</div>

<div id="btns" class="hide">
  <button class="pbtn" id="bHome" tabindex="-1">⌂ Kick TV</button>
  <button class="pbtn" id="bPrev" tabindex="-1">◀ Précédent</button>
  <button class="pbtn" id="bNext" tabindex="-1">Suivant ▶</button>
  <button class="pbtn" id="bRefresh" tabindex="-1">⟳ Actualiser</button>
  <button class="pbtn" id="bSound" tabindex="-1">🔊 Son</button>
</div>

<div id="toast" class="hide"></div>

<script src="data.js"></script>
<script>
/* ============================================================
   CARTOON TV : une chaîne de dessins animés du domaine public, 24h/24.
   Comme une vraie chaîne, le programme suit l'heure : en allumant,
   on tombe au milieu de ce qui passe en ce moment.
   ============================================================ */
var SERIES = { LT: "Looney Tunes", PO: "Popeye", BB: "Betty Boop" };
var EPOCH = Date.UTC(2026, 0, 1) / 1000;   // point de départ fixe de la grille des programmes
var SEED = 20260101;

var vid = document.getElementById("vid");
var info = document.getElementById("info");
var btns = document.getElementById("btns");
var toast = document.getElementById("toast");
var waitTxt = document.getElementById("waitTxt");

/* ---------- grille des programmes ---------- */
function rng(seed) {             // générateur pseudo-aléatoire reproductible (même grille pour tout le monde)
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function buildGrid() {
  var list = CARTOONS.slice(), r = rng(SEED), i, j, tmp;
  for (i = list.length - 1; i > 0; i--) { j = Math.floor(r() * (i + 1)); tmp = list[i]; list[i] = list[j]; list[j] = tmp; }
  // éviter deux épisodes de la même série à la suite quand c'est possible
  for (i = 1; i < list.length; i++) {
    if (list[i][0] === list[i - 1][0]) {
      for (j = i + 1; j < list.length; j++) {
        if (list[j][0] !== list[i - 1][0] && (j + 1 >= list.length || list[j + 1][0] !== list[i][0])) {
          tmp = list[i]; list[i] = list[j]; list[j] = tmp; break;
        }
      }
    }
  }
  return list;
}
var GRID = buildGrid();
var TOTAL = GRID.reduce(function (s, c) { return s + c[5]; }, 0);

function nowOnAir() {            // quel épisode passe maintenant, et depuis combien de secondes
  var pos = ((Date.now() / 1000 - EPOCH) % TOTAL + TOTAL) % TOTAL;
  for (var i = 0; i < GRID.length; i++) {
    if (pos < GRID[i][5]) return { index: i, offset: pos };
    pos -= GRID[i][5];
  }
  return { index: 0, offset: 0 };
}
function urlOf(c) { return "https://archive.org/download/" + c[3] + "/" + encodeURIComponent(c[4]); }

/* ---------- lecture ---------- */
var cur = 0;
var pendingSeek = 0;
var soundBlocked = false;
var lastT = -1, stallTicks = 0, failCount = 0;

function play(index, offset) {
  cur = (index + GRID.length) % GRID.length;
  var c = GRID[cur];
  pendingSeek = offset || 0;
  stallTicks = 0; lastT = -1;
  waitTxt.textContent = "Prochain dessin animé : " + c[1];
  vid.src = urlOf(c);
  vid.load();
  tryPlay();
  showInfo(true);
}
function tryPlay() {
  var p = vid.play();
  if (p && p.catch) {
    p.catch(function (err) {
      if (err && err.name === "NotAllowedError") {
        // la TV refuse le son sans action de ta part : on démarre en muet
        soundBlocked = true;
        vid.muted = true;
        vid.play().catch(function () {});
        showToast("Appuie sur OK pour activer le son", 6000);
      }
    });
  }
}
function enableSound() {
  if (!vid.muted) return false;
  vid.muted = false;
  soundBlocked = false;
  vid.play().catch(function () {});
  showToast("Son activé");
  return true;
}
vid.addEventListener("loadedmetadata", function () {
  if (pendingSeek > 1) {
    if (vid.duration && pendingSeek > vid.duration - 5) { pendingSeek = 0; next(true); return; }
    try { vid.currentTime = pendingSeek; } catch (e) {}
  }
  pendingSeek = 0;
});
vid.addEventListener("playing", function () { failCount = 0; });
vid.addEventListener("ended", function () { next(true); });
vid.addEventListener("error", function () { skipBroken(); });

function skipBroken() {
  failCount++;
  if (failCount > 5) {          // internet coupé ou Internet Archive en panne : on réessaie plus tard
    showToast("Connexion difficile… nouvel essai dans 30 s", 8000);
    setTimeout(function () { failCount = 0; resync(); }, 30000);
    return;
  }
  showToast("Épisode indisponible, on passe au suivant");
  setTimeout(function () { next(true); }, 1500);
}
// si l'image reste figée 25 s, on relance automatiquement
setInterval(function () {
  if (vid.paused || !vid.src) return;
  if (Math.abs(vid.currentTime - lastT) < 0.01) {
    stallTicks++;
    if (stallTicks === 3) { var t = vid.currentTime; vid.load(); pendingSeek = t; tryPlay(); }
    if (stallTicks >= 5) { stallTicks = 0; skipBroken(); }
  } else { stallTicks = 0; }
  lastT = vid.currentTime;
}, 5000);

function next(auto) { play(cur + 1, 0); if (!auto) showToast("Suivant ▶"); }
function prev() {
  // si on est au début de l'épisode, on revient au précédent ; sinon on le reprend du début
  if (vid.currentTime > 10) play(cur, 0); else play(cur - 1, 0);
  showToast("◀ Précédent");
}
function resync() { var n = nowOnAir(); play(n.index, n.offset); }
function refresh() { var t = vid.currentTime || 0; play(cur, t); showToast("Actualisation…"); }

/* ---------- affichage des infos ---------- */
var infoTimer = null, btnTimer = null, toastTimer = null;
function fmt(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + " min " + (s % 60 < 10 ? "0" : "") + (s % 60) + " s"; }
function showInfo(isStart, label) {
  var c = GRID[cur], n = GRID[(cur + 1) % GRID.length];
  document.getElementById("iLab").textContent = label || "En ce moment";
  document.getElementById("iTit").textContent = c[1];
  document.getElementById("iSub").textContent = SERIES[c[0]] + " · " + c[2] + " · Domaine public";
  document.getElementById("iNext").innerHTML = "À suivre : <b></b>";
  document.getElementById("iNext").querySelector("b").textContent = n[1] + " (" + SERIES[n[0]] + ")";
  info.classList.remove("hide");
  clearTimeout(infoTimer);
  infoTimer = setTimeout(function () { info.classList.add("hide"); }, isStart ? 8000 : 6000);
}
var nextShown = false;
vid.addEventListener("timeupdate", function () {
  var d = vid.duration || GRID[cur][5];
  document.getElementById("barFill").style.width = Math.min(100, vid.currentTime / d * 100) + "%";
  // annonce "à suivre" 20 s avant la fin, comme à la télé
  if (d - vid.currentTime < 20 && d - vid.currentTime > 0) {
    if (!nextShown) { nextShown = true; showInfo(false, "Bientôt la fin"); }
  } else { nextShown = false; }
});
function showButtons() {
  document.body.classList.add("pointer");
  btns.classList.remove("hide");
  clearTimeout(btnTimer);
  btnTimer = setTimeout(function () { btns.classList.add("hide"); document.body.classList.remove("pointer"); }, 5000);
}
function showToast(text, ms) {
  toast.textContent = text;
  toast.classList.remove("hide");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.classList.add("hide"); }, ms || 2500);
}

/* ---------- télécommande et curseur ---------- */
function goHome() { location.href = "../"; }
var BACK_KEYS = { 8: 1, 27: 1, 461: 1, 10009: 1, 166: 1 };
var lastKey = 0;
document.addEventListener("keydown", function (e) {
  var k = e.keyCode || e.which;
  var now = Date.now();
  if (BACK_KEYS[k]) { e.preventDefault(); goHome(); return; }
  if (now - lastKey < 400 && (k === 37 || k === 39)) { e.preventDefault(); return; }  // anti double appui
  lastKey = now;
  if (k === 39) { e.preventDefault(); next(false); }
  else if (k === 37) { e.preventDefault(); prev(); }
  else if (k === 13) { e.preventDefault(); if (!enableSound()) showInfo(false); }
  else if (k === 38 || k === 40) { e.preventDefault(); showInfo(false); }
  else if (k >= 403 && k <= 406) { e.preventDefault(); refresh(); }
});
document.getElementById("shield").addEventListener("click", function () { enableSound(); showInfo(false); showButtons(); });
document.addEventListener("mousemove", showButtons);
document.getElementById("bHome").addEventListener("click", goHome);
document.getElementById("bPrev").addEventListener("click", function () { prev(); showButtons(); });
document.getElementById("bNext").addEventListener("click", function () { next(false); showButtons(); });
document.getElementById("bRefresh").addEventListener("click", function () { refresh(); showButtons(); });
document.getElementById("bSound").addEventListener("click", function () { if (!enableSound()) { vid.muted = true; showToast("Son coupé"); } showButtons(); });

/* ---------- c'est parti ---------- */
resync();
setTimeout(function () {
  showToast(soundBlocked ? "Appuie sur OK pour activer le son · ◀ ▶ : changer"
                         : "◀ ▶ : changer · OK : infos · Retour : Kick TV", 6000);
}, 1500);
</script>
</body>
</html>
